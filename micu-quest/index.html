<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MICU QUEST | 픽셀 중환자실</title>
<style>
:root{--navy:#17294a;--edge:#273c68;--light:#f5f8ff;--gold:#ffdb88;--blue:#3778f4}*{box-sizing:border-box}body{margin:0;background:#121c33;color:#182b50;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f8bd43;outline-offset:2px}.app{max-width:1460px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:#d8e5f2;border:5px solid #1d2947}.ward{height:59vh;min-height:390px;position:relative;overflow:hidden;background-color:#dbe5ee;background-image:linear-gradient(#b9c8d5 2px,transparent 2px),linear-gradient(90deg,#b9c8d5 2px,transparent 2px);background-size:64px 64px}.ward:before{content:"";position:absolute;inset:0 0 auto;height:72px;background:linear-gradient(#bccbdc,#f2f5fc);border-bottom:8px solid #566581}.hud{position:absolute;z-index:4;top:14px;left:15px;right:15px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.sign,.clock{background:#1b3055;color:white;border:5px solid #eef4ff;outline:3px solid #26385d;box-shadow:4px 5px #111f3b;padding:8px 20px;font-weight:900;text-shadow:2px 2px #53688b}.sign{font-size:25px}.sign small{display:block;font-size:14px;text-align:center}.clock{font-size:15px}.layout{position:absolute;top:100px;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(135px,1fr));gap:20px}.bay{position:relative;display:flex;align-items:center;justify-content:center;border-right:6px solid #97b4c9}.bed{position:relative;width:123px;height:133px;background:#edf3f8;border:8px solid #65748c;box-shadow:7px 7px #72849b;border-radius:17px 17px 8px 8px;text-align:center;padding-top:8px}.bed:after{content:"";position:absolute;bottom:3px;left:4px;right:4px;height:24px;background:#94b1d8;border:3px solid #47648b}.patient{font-size:47px;display:block;filter:saturate(.75)}.blanket{font-size:43px;line-height:28px}.monitor{position:absolute;right:2px;top:8px;background:#152744;color:#42f5b7;border:5px solid #8796ad;box-shadow:3px 3px #4e5e7e;border-radius:4px;font-family:monospace;font-weight:900;font-size:17px;padding:7px 5px}.pump{position:absolute;left:0;top:20px;font-size:43px}.cabinet{position:absolute;left:1%;bottom:6%;font-size:51px;opacity:.82}.station{position:absolute;left:6%;top:48%;background:#f8e5bf;border:6px solid #8295b0;padding:10px 22px;box-shadow:7px 7px #8295b0;font-size:33px}.sprites{position:absolute;left:50%;top:53%;z-index:2;transform:translate(-50%,-50%);display:flex;align-items:center;gap:23px}.sprite{font-size:60px;filter:drop-shadow(4px 5px 0 #8294ab);animation:bob 2.1s ease-in-out infinite}.sprite:nth-child(2){animation-delay:.4s}.bubble{position:absolute;left:56%;top:-28px;background:white;border:3px solid var(--edge);padding:4px 14px;border-radius:20px;font-weight:900}.lower{position:relative;z-index:5;margin-top:-3px;background:#aabbd8;border-top:6px solid #384e78;padding:13px;min-height:40vh;display:grid;grid-template-columns:245px minmax(0,1fr) 300px;gap:12px}.portrait{align-self:end;display:flex;flex-direction:column;justify-content:flex-end;min-height:260px}.face{font-size:145px;text-align:center;line-height:1.15;filter:drop-shadow(5px 5px #546b91);transition:transform .25s}.who{background:#1d3055;border:5px solid white;outline:3px solid #25395d;color:white;text-align:center;padding:10px;font-size:22px;font-weight:900}.who small{display:block;font-size:13px;font-weight:500}.dialog,.answer{background:#fffdfa;border:5px solid #f9fbff;outline:3px solid #283c66;border-radius:13px;padding:22px;box-shadow:5px 5px #6a7f9e}.dialog{display:flex;flex-direction:column;min-height:287px}.chapter{font-size:13px;font-weight:900;color:#49659d;letter-spacing:.08em}.speech{font-size:clamp(17px,1.8vw,23px);font-weight:900;line-height:1.65;white-space:pre-line;min-height:90px}.cursor:after{content:"▌";color:#387bff;animation:blink .7s step-end infinite}.case{border:2px solid #e2cda7;background:#fff6e7;border-radius:9px;padding:12px 14px;white-space:pre-line;line-height:1.6;margin:9px 0;flex:1;font-size:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}.btn{border:3px solid #263d6d;border-radius:6px;background:#dfe9ff;color:#172c53;font-weight:900;padding:11px 15px;box-shadow:3px 4px #a5b8d8}.btn.primary{background:#3574ed;color:#fff}.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.42;cursor:default}.answer h3{font-size:18px;margin:0 0 14px}.inputrow{display:flex;gap:9px;align-items:center}.inputrow input{width:100%;min-width:0;border:3px solid #8099c3;border-radius:6px;text-align:center;padding:12px;font-size:25px;font-weight:800;color:#193768}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.keypad button{background:#e8efff;border:2px solid #8397bc;border-radius:6px;padding:10px;font-size:19px;font-weight:900;color:#213b6d}.submit{display:flex;gap:8px;margin-top:13px}.submit .btn{flex:1;padding:11px 4px}.feedback{font-size:14px;font-weight:800;margin-top:11px;min-height:24px}.roommask{position:absolute;inset:0;background:rgba(12,25,50,.83);z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .45s}.roommask.hidden{opacity:0;pointer-events:none}.choose{width:min(660px,100%);background:#fff;border:6px solid #fafcff;outline:4px solid #2b446e;border-radius:12px;text-align:center;padding:27px;box-shadow:9px 10px #091629}.choose h1{font-size:37px;color:#17335e;margin:3px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.rooms .btn{min-height:92px}.screenfade{position:absolute;inset:0;z-index:9;background:#102044;opacity:0;pointer-events:none;transition:opacity .38s}.screenfade.on{opacity:1}.score{font-weight:900;color:#315fbc}.hiddenpanel{opacity:.45;pointer-events:none}.tools{position:absolute;bottom:8px;right:8px;z-index:6;display:flex;gap:8px}.tools a{font-size:12px;background:#e6ecf7;padding:7px;border:2px solid #344e76;border-radius:4px;color:#193968;text-decoration:none}.tag{font-size:12px;color:#647799;margin-top:7px} @keyframes bob{50%{transform:translateY(-5px)}}@keyframes blink{50%{opacity:0}}@media(max-width:950px){.lower{grid-template-columns:130px 1fr}.portrait{min-height:185px}.face{font-size:91px}.who{font-size:16px}.answer{grid-column:1/-1}.ward{height:43vh;min-height:310px}.bay:nth-child(n+5){display:none}.layout{grid-template-rows:1fr}.station{display:none}.sprites{top:65%}}@media(max-width:580px){.app{border:0}.sign{font-size:17px;padding:5px 10px}.sign small,.clock{font-size:10px}.ward{min-height:300px;height:38vh}.layout{top:82px;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:1px}.bay:nth-child(n+5){display:none}.bed{width:85px;height:91px;padding:0;border-width:5px}.patient{font-size:31px}.blanket{font-size:25px;line-height:20px}.monitor{font-size:10px;padding:3px;right:0}.pump{font-size:24px}.sprites{top:58%;gap:8px}.sprite{font-size:39px}.lower{grid-template-columns:87px 1fr;padding:9px;gap:9px}.portrait{min-height:120px}.face{font-size:68px}.who{font-size:12px;padding:5px}.who small{font-size:9px}.dialog{padding:13px;min-height:250px}.speech{font-size:16px;min-height:75px}.case{font-size:13px;padding:9px}.answer{padding:15px}.rooms{grid-template-columns:1fr}.rooms .btn{min-height:54px}.choose h1{font-size:29px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="app">
<div class="ward"><div class="hud"><div class="sign">MICU ♡<small>중환자실</small></div><div class="clock">☀️ DAY 1 · 09:20<br>MICU WARD</div></div><div class="layout" id="wardBeds"></div><div class="station">👩🏻‍⚕️ 🖥️ 👩🏽‍⚕️</div><div class="sprites"><span class="sprite">🧑🏻‍⚕️</span><span class="bubble">···</span><span class="sprite">🧍🏻</span></div></div>
<div class="lower"><div class="portrait"><div class="face" id="face">🧑🏻‍⚕️</div><div class="who" id="who">담당 의사<small>중환자실</small></div></div><section class="dialog"><div class="chapter" id="chapter">MISSION READY</div><div class="speech" id="speech" aria-live="polite"></div><div class="case" id="case">병실을 선택하면 담당 의사가 환자 상황을 설명합니다.</div><div class="actions"><span class="score" id="score">★ 0 / 0</span><button class="btn" id="skip" type="button">대사 건너뛰기</button><button class="btn primary" id="next" type="button">다음 ▶</button></div></section><aside class="answer hiddenpanel" id="answer"><h3>💉 정답을 입력하세요</h3><div id="drugname" style="font-weight:900;margin-bottom:10px">주입 속도</div><div class="inputrow"><input id="value" type="number" inputmode="decimal" min="0" step="any" placeholder="0.0" aria-label="주입 속도"><strong>mL/hr</strong></div><div class="keypad" id="keypad"></div><div class="submit"><button class="btn primary" id="submit" type="button">제출하기</button><button class="btn" id="hint" type="button">힌트 보기</button></div><div class="feedback" id="feedback"></div><div class="tag">전시회용 교육 게임 · 실제 투약에 사용 금지</div></aside></div>
<div class="tools"><a href="https://shwldls.github.io/caltest/" target="_blank" rel="noopener">↗ 기존 약물계산기</a><a href="#" id="restart">↺ 처음으로</a></div>
<div class="roommask" id="roommask"><div class="choose"><div style="font-size:42px">🏥</div><h1>MICU QUEST</h1><p>병실을 선택하면 의사와 함께 약물 투여 미션을 진행합니다.</p><div class="rooms" id="rooms"><button class="btn" data-room="0">🩺 01호실<br>패혈성 쇼크</button><button class="btn" data-room="1">❤️ 02호실<br>수술 후 부정맥</button><button class="btn" data-room="2">🫁 03호실<br>인공호흡기 진정</button></div><button class="btn primary" id="random">🎲 랜덤 배정</button><p class="tag">약물 희석 농도는 교육용 예시이며 기관 프로토콜과 다를 수 있습니다.</p></div></div><div class="screenfade" id="fade"></div></main>
<script>
const $=id=>document.getElementById(id);
const beds=$('wardBeds');beds.innerHTML=Array.from({length:8},(_,i)=>'<div class="bay"><span class="pump">💉</span><div class="bed"><span class="patient">'+(i%3===0?'👨🏻':i%3===1?'👴🏻':'👩🏻')+'</span><span class="blanket">🛏️</span></div><div class="monitor">⌁ '+(88+i*3)+'<br>⌁ '+(92+i%5)+'<br>⌁ '+(16+i%8)+'</div></div>').join('');
const quests=[
 {title:'패혈성 쇼크',name:'68세 남자 · 담관염',steps:[
 {drug:'Norepinephrine',intro:'응급실에서 패혈성 쇼크 환자가 올라왔어요.\nMAP이 58 mmHg예요. 환자를 같이 봐줄래요?',detail:'68세 남자 · 체중 68 kg\n담관염으로 인한 패혈성 쇼크\nCentral line 없음 · 말초정맥 투여\n처방: Norepinephrine 10 mcg/min\n교육용 가정: 4 mg / 총 250 mL',question:'Norepinephrine의 시간당 주입 속도는?',answer:37.5,hint:'10 mcg/min × 60 ÷ (4000 mcg / 250 mL)'},
 {drug:'Vasopressin',intro:'좋아요! 그런데 승압제가 추가 처방됐어요.\n이번엔 Vasopressin 계산을 부탁할게요.',detail:'추가 처방(교육용 가정): Vasopressin 0.03 units/min\n교육용 가정: 20 units / 총 100 mL',question:'Vasopressin의 시간당 주입 속도는?',answer:9,hint:'0.03 units/min × 60 ÷ (20 units / 100 mL)'}]},
 {title:'심장수술 후 부정맥',name:'80 kg 남자 · CABG POD 2',steps:[
 {drug:'Herben (Diltiazem)',intro:'CABG 수술 후 2일째 환자가 AF RVR로 바뀌었어요.\n먼저 시작한 약물 속도를 계산해 봅시다.',detail:'80 kg 남자 · CABG POD 2\nHR 150/min, AF RVR\n처방: Herben 10 mg/hr\n교육용 가정: 100 mg / 총 100 mL',question:'Herben CIV 주입 속도는?',answer:10,hint:'10 mg/hr ÷ (100 mg / 100 mL)'},
 {drug:'Amiodarone (처음 6시간)',intro:'혈압이 85/50 mmHg로 떨어져 Herben을 중단했어요.\nAmiodarone 새 처방을 확인해 주세요.',detail:'Herben 중단 · Amiodarone으로 변경\n처음 6시간: 1 mg/min\n교육용 가정: 900 mg / 총 500 mL',question:'처음 6시간 Amiodarone 주입 속도는?',answer:33.33,hint:'1 mg/min × 60 ÷ (900 mg / 500 mL)'},
 {drug:'Amiodarone (6시간 이후)',intro:'6시간이 지났어요.\n이제 감량된 유지 속도를 계산해 주세요.',detail:'6시간 이후 18시간 유지: 0.5 mg/min\n교육용 가정: 900 mg / 총 500 mL',question:'감량 후 주입 속도는?',answer:16.67,hint:'0.5 mg/min × 60 ÷ (900 mg / 500 mL)'}]},
 {title:'인공호흡기 진정',name:'70 kg 남자 · 폐렴',steps:[
 {drug:'Precedex',intro:'폐렴으로 기관삽관한 환자가 MICU에 입실했어요.\n진정제 주입 속도를 계산해 주시겠어요?',detail:'70 kg 남자 · 폐렴 · 기관삽관\n처방: Precedex 0.4 mcg/kg/hr\n교육용 가정: 200 mcg / 총 50 mL',question:'Precedex의 시간당 주입 속도는?',answer:7,hint:'0.4 × 70 ÷ (200 mcg / 50 mL)'},
 {drug:'Remifentanil',intro:'좋아요! 진통제도 함께 투여할 예정이에요.\n마지막 계산까지 부탁할게요.',detail:'70 kg 남자 · 기관삽관 상태\n처방: Remifentanil 0.05 mcg/kg/min\n교육용 가정: 2 mg / 총 50 mL',question:'Remifentanil의 시간당 주입 속도는?',answer:5.25,hint:'0.05 × 70 × 60 ÷ (2000 mcg / 50 mL)'}]}
];
let room=0,step=0,phase='intro',typing=false,full='',timer=null,success=0,ready=false;
function type(text){clearInterval(timer);full=text;typing=true;const el=$('speech');el.textContent='';el.classList.add('cursor');let i=0;timer=setInterval(()=>{i=Math.min(text.length,i+2);el.textContent=text.slice(0,i);if(i>=text.length){clearInterval(timer);typing=false;el.classList.remove('cursor')}},27)}
function finishType(){if(!typing)return false;clearInterval(timer);typing=false;$('speech').textContent=full;$('speech').classList.remove('cursor');return true}
function fade(fn){$('fade').classList.add('on');setTimeout(()=>{fn();requestAnimationFrame(()=>$('fade').classList.remove('on'))},410)}
function current(){return quests[room].steps[step]}
function render(){let q=current();$('chapter').textContent='CASE '+String(room+1).padStart(2,'0')+' · '+quests[room].title+' · '+(step+1)+'/'+quests[room].steps.length;$('who').innerHTML=(phase==='done'?'담당 간호사':'담당 의사')+'<small>'+(phase==='done'?'MICU':'중환자실')+'</small>';$('face').textContent=phase==='done'?'👩🏻‍⚕️':'🧑🏻‍⚕️';$('score').textContent='★ '+success+' / '+quests[room].steps.length;$('feedback').textContent='';$('answer').classList.add('hiddenpanel');$('value').value='';ready=false;
if(phase==='intro'){type(q.intro);$('case').textContent='📋 환자: '+quests[room].name+'\n\n의사의 설명을 듣고 [다음]을 누르세요.';$('next').textContent='처방 확인 ▶';$('next').disabled=false}
else if(phase==='question'){type('처방을 확인했나요?\n'+q.question);$('case').textContent='📋 환자 정보 및 처방\n'+q.detail;$('drugname').textContent=q.drug+' · 주입 속도';$('answer').classList.remove('hiddenpanel');$('next').textContent='정답 제출 후 진행';$('next').disabled=true}
else if(phase==='correct'){type('정확해요! 계산 미션 성공! 🎉\n다음 상황을 확인해 볼까요?');$('case').textContent='✅ '+q.drug+'\n정답: '+Number(q.answer.toFixed(2))+' mL/hr\n\n교육용 예시 농도 기준입니다.';$('next').textContent=step+1<quests[room].steps.length?'다음 처방 ▶':'미션 완료 ▶';$('next').disabled=false}
else{type('모든 계산 미션을 완료했어요!\n환자 안전을 위한 꼼꼼한 계산, 훌륭해요!');$('case').textContent='🏆 MICU QUEST COMPLETE\n'+quests[room].title+'\n완료: '+success+' / '+quests[room].steps.length+' 미션';$('next').textContent='다른 환자 선택 ▶';$('next').disabled=false}}
function choose(n){room=n;step=0;success=0;phase='intro';$('roommask').classList.add('hidden');fade(render)}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.room)));$('random').onclick=()=>choose(Math.floor(Math.random()*quests.length));
$('next').onclick=()=>{if(finishType())return;if(phase==='intro'){phase='question';render()}else if(phase==='correct'){if(step+1<quests[room].steps.length){step++;phase='intro';fade(render)}else{phase='done';fade(render)}}else if(phase==='done')reset()};
$('skip').onclick=()=>{if(!finishType()&&phase==='intro'){$('next').click()}};
$('submit').onclick=()=>{if(phase!=='question')return;const v=Number($('value').value),q=current();if(!$('value').value||!Number.isFinite(v)||v<0){$('feedback').textContent='숫자로 주입 속도를 입력해 주세요.';return}if(Math.abs(v-q.answer)<=Math.max(.03,q.answer*.005)){success++;phase='correct';render()}else{$('feedback').textContent='다시 계산해 볼까요? 💡 힌트도 확인할 수 있어요.';$('feedback').style.color='#bd3e48'}};
$('hint').onclick=()=>{if(phase==='question')$('feedback').textContent='💡 '+current().hint};
const pad=$('keypad');['1','2','3','4','5','6','7','8','9','.','0','⌫'].forEach(k=>{let b=document.createElement('button');b.type='button';b.textContent=k;b.onclick=()=>{let el=$('value');el.value=k==='⌫'?el.value.slice(0,-1):el.value+k;el.focus()};pad.appendChild(b)});
function reset(){clearInterval(timer);$('roommask').classList.remove('hidden');$('answer').classList.add('hiddenpanel');$('speech').textContent='새로운 환자를 선택하세요.';$('case').textContent='3가지 MICU 시나리오가 준비되어 있습니다.';$('score').textContent='★ 0 / 0'}$('restart').onclick=e=>{e.preventDefault();reset()};$('speech').textContent='병실을 선택해 주세요.';
</script></body></html>
